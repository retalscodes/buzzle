<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <clipPath id="bc1"><circle cx="0" cy="0" r="88"/></clipPath>
    <clipPath id="bc2"><circle cx="0" cy="0" r="76"/></clipPath>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="248" fill="#7BBFDF"/>

  <!-- Heart flight path (faint, behind bees) -->
  <path d="M 158,215 C 128,175 148,128 185,145 C 205,154 218,175 225,195
           C 232,175 245,154 265,145 C 302,128 322,175 292,215
           C 272,240 250,262 225,278 C 200,262 178,240 158,215 Z"
        fill="none" stroke="#5A9BBF" stroke-width="3" opacity="0.45"/>

  <!-- BEE 1 — upper-left, facing right -->
  <g transform="translate(168,205) rotate(-12)">
    <!-- Wings behind body -->
    <ellipse cx="-62" cy="-72" rx="52" ry="30" fill="#7FD4C8" stroke="#2C1200" stroke-width="3.5" transform="rotate(-28,-62,-72)"/>
    <ellipse cx="-38" cy="-50" rx="37" ry="22" fill="#7FD4C8" stroke="#2C1200" stroke-width="3" transform="rotate(-10,-38,-50)"/>
    <!-- Body base -->
    <circle cx="0" cy="0" r="88" fill="#FFD820" stroke="#2C1200" stroke-width="4.5"/>
    <!-- Stripes clipped to body -->
    <g clip-path="url(#bc1)">
      <rect x="-88" y="8"  width="176" height="32" fill="#1A1000" opacity="0.90"/>
      <rect x="-88" y="55" width="176" height="30" fill="#1A1000" opacity="0.88"/>
    </g>
    <!-- Body outline on top -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#2C1200" stroke-width="4.5"/>
    <!-- Antennae (curly spirals) -->
    <path d="M 18,-86 C 24,-116 46,-128 52,-118 C 58,-108 46,-97 38,-108"
          stroke="#2C1200" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 38,-82 C 46,-112 68,-122 73,-112 C 78,-102 66,-90 58,-102"
          stroke="#2C1200" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="30" cy="-28" r="8"   fill="#1A1000"/>
    <circle cx="53" cy="-33" r="8"   fill="#1A1000"/>
    <circle cx="26" cy="-33" r="3.2" fill="white"/>
    <circle cx="49" cy="-38" r="3.2" fill="white"/>
    <!-- Rosy cheeks -->
    <ellipse cx="17" cy="-12" rx="12" ry="8.5" fill="#FF9EB8" opacity="0.55"/>
    <ellipse cx="60" cy="-16" rx="12" ry="8.5" fill="#FF9EB8" opacity="0.55"/>
    <!-- Smile -->
    <path d="M 23,0 Q 38,14 53,0" stroke="#2C1200" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BEE 2 — lower-right, facing left -->
  <g transform="translate(338,330) rotate(15)">
    <!-- Wings (right side, mirrored) -->
    <ellipse cx="56" cy="-64" rx="47" ry="27" fill="#7FD4C8" stroke="#2C1200" stroke-width="3.5" transform="rotate(28,56,-64)"/>
    <ellipse cx="34" cy="-46" rx="34" ry="20" fill="#7FD4C8" stroke="#2C1200" stroke-width="3" transform="rotate(10,34,-46)"/>
    <!-- Body -->
    <circle cx="0" cy="0" r="76" fill="#FFD820" stroke="#2C1200" stroke-width="4.5"/>
    <!-- Stripes -->
    <g clip-path="url(#bc2)">
      <rect x="-76" y="6"  width="152" height="28" fill="#1A1000" opacity="0.90"/>
      <rect x="-76" y="47" width="152" height="26" fill="#1A1000" opacity="0.88"/>
    </g>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#2C1200" stroke-width="4.5"/>
    <!-- Antennae (mirrored, left side) -->
    <path d="M -18,-75 C -24,-103 -45,-115 -51,-105 C -57,-95 -44,-84 -37,-95"
          stroke="#2C1200" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -36,-71 C -44,-99 -65,-109 -70,-99 C -75,-89 -63,-77 -55,-89"
          stroke="#2C1200" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Eyes (left side, facing left) -->
    <circle cx="-28" cy="-26" r="7.5" fill="#1A1000"/>
    <circle cx="-50" cy="-30" r="7.5" fill="#1A1000"/>
    <circle cx="-24" cy="-31" r="3"   fill="white"/>
    <circle cx="-46" cy="-35" r="3"   fill="white"/>
    <!-- Cheeks -->
    <ellipse cx="-15" cy="-11" rx="11" ry="7.5" fill="#FF9EB8" opacity="0.52"/>
    <ellipse cx="-56" cy="-14" rx="11" ry="7.5" fill="#FF9EB8" opacity="0.52"/>
    <!-- Smile -->
    <path d="M -50,2 Q -36,15 -22,2" stroke="#2C1200" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pink hearts between bees -->
  <path d="M 232,148 C 232,137 243,133 248,141 C 253,133 264,137 264,148 C 264,159 248,172 248,172 C 248,172 232,159 232,148 Z"
        fill="#E8427A" stroke="#2C1200" stroke-width="2.5"/>
  <path d="M 253,106 C 253,98 261,95 265,101 C 269,95 277,98 277,106 C 277,114 265,123 265,123 C 265,123 253,114 253,106 Z"
        fill="#E8427A" stroke="#2C1200" stroke-width="2"/>
  <path d="M 210,118 C 210,112 216,110 219,114 C 222,110 228,112 228,118 C 228,124 219,131 219,131 C 219,131 210,124 210,118 Z"
        fill="#E8427A" stroke="#2C1200" stroke-width="1.8"/>

  <!-- Buzzle wordmark -->
  <text x="250" y="466"
        font-family="Georgia,'Times New Roman',serif"
        font-size="50" font-weight="bold"
        text-anchor="middle" letter-spacing="4"
        fill="white" stroke="#2C1200" stroke-width="3.5"
        paint-order="stroke fill">Buzzle</text>
</svg>
